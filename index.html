<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mi Música</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #121212;
        }

        .screen.active {
            display: flex;
        }

        .header {
            padding: 20px;
            background-color: #1e1e1e;
            text-align: center;
            border-bottom: 1px solid #2a2a2a;
        }

        .header h2 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #00ff66;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 14px;
            background-color: #181818;
            border-radius: 8px;
            cursor: pointer;
        }

        .list-item:active {
            background-color: #282828;
        }

        .album-cover-placeholder {
            width: 48px;
            height: 48px;
            background-color: #282828;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 14px;
        }

        .album-text h4, .song-text h4 {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .album-text p {
            font-size: 12px;
            color: #a0a0a0;
        }

        .footer {
            padding: 15px;
            background-color: #1e1e1e;
            border-top: 1px solid #2a2a2a;
            display: flex;
            justify-content: center;
        }

        .btn-back-footer {
            background-color: #282828;
            color: #ffffff;
            border: 1px solid #444;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Estilos específicos del Reproductor */
        .player-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 20px;
            text-align: center;
        }

        .player-cover {
            width: 220px;
            height: 220px;
            background-color: #222;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .player-info h3 {
            font-size: 18px;
            margin-bottom: 6px;
        }

        .player-info p {
            font-size: 14px;
            color: #a0a0a0;
        }

        /* Barra de Progreso */
        .progress-container {
            width: 100%;
            padding: 0 10px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 3px;
            outline: none;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00ff66;
            cursor: pointer;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a0a0a0;
            margin-top: 8px;
        }

        /* Controles */
        .player-controls {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .btn-ctrl {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 28px;
            cursor: pointer;
            padding: 10px;
        }

        .btn-ctrl-main {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: #00ff66;
            color: #000000;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
        }

        .btn-ctrl:active, .btn-ctrl-main:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="screen-albums" class="screen active">
        <div class="header">
            <h2>ÁLBUMES</h2>
        </div>
        <div class="content">
            <div class="list-container"></div>
        </div>
    </div>

    <div id="screen-songs" class="screen">
        <div class="header">
            <h2 id="songs-header-title">CANCIONES</h2>
        </div>
        <div class="content">
            <div class="list-container"></div>
        </div>
        <div class="footer">
            <button class="btn-back-footer">VOLVER A ÁLBUMES</button>
        </div>
    </div>

    <div id="screen-player" class="screen">
        <div class="header">
            <h2>REPRODUCIENDO</h2>
        </div>
        <div class="player-container">
            <div class="player-cover">🎵</div>
            <div class="player-info">
                <h3 class="player-song-title">Título de la Canción</h3>
                <p class="player-artist-album">Nombre del Álbum</p>
            </div>

            <div class="progress-container">
                <input type="range" class="progress-bar" id="seek-bar" value="0" min="0" max="100">
                <div class="time-stamps">
                    <span id="current-time">0:00</span>
                    <span id="total-duration">0:00</span>
                </div>
            </div>

            <div class="player-controls">
                <button class="btn-ctrl" id="btn-prev">⏮</button>
                <button class="btn-ctrl-main" id="btn-play-pause">▶</button>
                <button class="btn-ctrl" id="btn-next">⏭</button>
            </div>
        </div>
        <div class="footer">
            <button class="btn-back-footer">VOLVER A CANCIONES</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
