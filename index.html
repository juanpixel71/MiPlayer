<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Música</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pantalla de Bienvenida / Apertura de Carpeta -->
    <div id="screen-welcome" class="screen active">
        <div class="welcome-card">
            <div class="app-logo">🎵</div>
            <h1>Mi Música</h1>
            <p>Selecciona tu carpeta de música para comenzar a escuchar sin conexión.</p>
            <button id="btn-select-folder" class="btn-primary">Abrir Mi Música</button>
            <input type="file" id="file-input" webkitdirectory directory multiple style="display: none;">
        </div>
    </div>

    <!-- Pantalla Principal de la App -->
    <div id="screen-main" class="screen">
        
        <!-- Cabecera -->
        <header class="app-header">
            <h2>Mi Música</h2>
            <button id="btn-change-folder" class="btn-secondary-sm">Cambiar Carpeta</button>
        </header>

        <!-- Pestañas de Navegación (Boceto Original) -->
        <nav class="tabs-nav">
            <button class="tab-btn active" data-tab="albums">Álbumes</button>
            <button class="tab-btn" data-tab="artists">Artistas</button>
            <button class="tab-btn" data-tab="songs">Canciones</button>
        </nav>

        <!-- Contenido de Pestañas -->
        <main class="content-area">
            
            <!-- Vista de Álbumes (Carpetas) -->
            <section id="tab-albums" class="tab-content active">
                <div id="albums-grid" class="albums-grid"></div>
            </section>

            <!-- Vista de Artistas -->
            <section id="tab-artists" class="tab-content">
                <div id="artists-list" class="simple-list"></div>
            </section>

            <!-- Vista de Canciones (Todas) -->
            <section id="tab-songs" class="tab-content">
                <div id="songs-list" class="simple-list"></div>
            </section>

            <!-- Vista Detalle (Dentro de un álbum/artista) -->
            <section id="view-detail" class="detail-view hidden">
                <div class="detail-header">
                    <button id="btn-back" class="btn-icon">← Volver</button>
                    <h3 id="detail-title">Nombre del Álbum</h3>
                </div>
                <div id="detail-songs-list" class="simple-list"></div>
            </section>

        </main>

        <!-- Reproductor Inferior Flotante -->
        <div id="mini-player" class="mini-player hidden">
            <div class="player-info">
                <span id="player-title" class="track-title">Ninguna canción</span>
                <span id="player-artist" class="track-artist">--</span>
            </div>
            <div class="player-controls">
                <button id="btn-prev" class="btn-player">⏮</button>
                <button id="btn-play-pause" class="btn-player btn-main-play">▶</button>
                <button id="btn-next" class="btn-player">⏭</button>
            </div>
            <audio id="audio-element"></audio>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
