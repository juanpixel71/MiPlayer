<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Música</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app-container">
    <!-- Encabezado con selector de carpeta y botón volver -->
    <header class="app-header">
      <button id="btn-back" class="btn-secondary hidden">⬅ Álbumes</button>
      <h1 id="header-title">Mi Música</h1>
      <label for="folder-input" class="btn-main-small">📂 Abrir MiMusica</label>
      <input type="file" id="folder-input" webkitdirectory directory multiple accept="audio/*" style="display:none;">
    </header>

    <!-- Vista 1: Lista de Álbumes / Canciones -->
    <main id="content-view" class="content-area">
      <div id="placeholder" class="placeholder">
        <p>Selecciona la carpeta <strong>MiMusica</strong> para cargar tus álbumes.</p>
      </div>
      <div id="list-container" class="list-container"></div>
    </main>

    <!-- Vista 2: Reproductor estilo Files de Google -->
    <section class="now-playing-panel">
      <!-- Arte del Álbum / Portada central -->
      <div class="album-art-container">
        <div class="album-art-placeholder" id="album-art">
          🎵
        </div>
      </div>

      <!-- Información del tema -->
      <div class="track-info">
        <div id="track-title" class="track-title">Sin reproducción</div>
        <div id="track-album" class="track-album">Selecciona un tema</div>
      </div>

      <!-- Barra de progreso / Tiempo -->
      <div class="progress-section">
        <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
        <div class="time-display">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <!-- Elemento Audio oculto -->
      <audio id="audio-element"></audio>

      <!-- Botones gigantes de control -->
      <div class="controls-bar">
        <button id="btn-prev" class="btn-ctrl" title="Anterior">⏮</button>
        <button id="btn-play" class="btn-ctrl btn-main-ctrl" title="Reproducir/Pausar">▶</button>
        <button id="btn-stop" class="btn-ctrl" title="Detener">⏹</button>
        <button id="btn-next" class="btn-ctrl" title="Siguiente">⏭</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
