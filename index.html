<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Música</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
        body { background-color: #121212; color: #ffffff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }
        
        /* Pantalla Bienvenida */
        #screen-welcome { justify-content: center; align-items: center; padding: 20px; text-align: center; background: linear-gradient(180deg, #1e1e1e 0%, #121212 100%); }
        .welcome-card { background: #282828; padding: 30px 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); max-width: 350px; width: 100%; }
        .app-logo { font-size: 64px; margin-bottom: 10px; }
        .welcome-card h1 { font-size: 24px; margin-bottom: 10px; color: #fff; }
        .welcome-card p { font-size: 14px; color: #b3b3b3; margin-bottom: 25px; line-height: 1.4; }
        
        /* Botones */
        .btn-primary { background: #1db954; color: #fff; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 30px; width: 100%; cursor: pointer; }
        .btn-primary:active { transform: scale(0.98); background: #1ed760; }
        .btn-secondary-sm { background: #333; color: #fff; border: none; padding: 6px 12px; font-size: 12px; border-radius: 15px; }
        .btn-icon { background: none; border: none; color: #1db954; font-size: 16px; font-weight: bold; cursor: pointer; padding: 5px 0; }

        /* Cabecera y Navegación */
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #181818; border-bottom: 1px solid #282828; }
        .tabs-nav { display: flex; background: #181818; border-bottom: 1px solid #282828; }
        .tab-btn { flex: 1; padding: 12px 0; background: none; border: none; color: #b3b3b3; font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #1db954; border-bottom-color: #1db954; }

        /* Contenido */
        .content-area { flex: 1; overflow-y: auto; padding: 15px; position: relative; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .hidden { display: none !important; }

        /* Rejilla de Álbumes */
        .albums-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .album-card { background: #181818; border-radius: 8px; padding: 12px; text-align: center; }
        .album-cover { font-size: 40px; background: #282828; border-radius: 6px; padding: 20px 0; margin-bottom: 8px; }
        .album-info h4 { font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-info p { font-size: 12px; color: #b3b3b3; margin-top: 2px; }
        .album-info .count { font-size: 11px; color: #1db954; margin-top: 4px; display: block; }

        /* Listas */
        .simple-list { display: flex; flex-direction: column; gap: 8px; }
        .list-item { display: flex; align-items: center; background: #181818; padding: 10px 12px; border-radius: 6px; }
        .item-icon { font-size: 20px; margin-right: 12px; color: #1db954; }
        .item-info h4 { font-size: 14px; color: #fff; }
        .item-info p { font-size: 12px; color: #b3b3b3; }

        /* Reproductor Flotante */
        .mini-player { display: flex; align-items: center; justify-content: space-between; background: #282828; padding: 10px 15px; border-top: 1px solid #333; position: sticky; bottom: 0; }
        .player-info { display: flex; flex-direction: column; max-width: 60%; }
        .track-title { font-size: 13px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 11px; color: #b3b3b3; }
        .player-controls { display: flex; gap: 10px; align-items: center; }
        .btn-player { background: none; border: none; color: #fff; font-size: 18px; padding: 5px; }
        .btn-main-play { font-size: 22px; color: #1db954; }
    </style>
</head>
<body>

    <!-- Pantalla de Bienvenida -->
    <div id="screen-welcome" class="screen active">
        <div class="welcome-card">
            <div class="app-logo">🎵</div>
            <h1>Mi Música</h1>
            <p>Selecciona tu carpeta de música para comenzar a escuchar sin conexión.</p>
            <button id="btn-select-folder" class="btn-primary">Abrir Mi Música</button>
            <input type="file" id="file-input" webkitdirectory directory multiple style="display: none;">
        </div>
    </div>

    <!-- Pantalla Principal -->
    <div id="screen-main" class="screen">
        <header class="app-header">
            <h2>Mi Música</h2>
            <button id="btn-change-folder" class="btn-secondary-sm">Cambiar Carpeta</button>
        </header>

        <nav class="tabs-nav">
            <button class="tab-btn active" data-tab="albums">Álbumes</button>
            <button class="tab-btn" data-tab="artists">Artistas</button>
            <button class="tab-btn" data-tab="songs">Canciones</button>
        </nav>

        <main class="content-area">
            <section id="tab-albums" class="tab-content active">
                <div id="albums-grid" class="albums-grid"></div>
            </section>

            <section id="tab-artists" class="tab-content">
                <div id="artists-list" class="simple-list"></div>
            </section>

            <section id="tab-songs" class="tab-content">
                <div id="songs-list" class="simple-list"></div>
            </section>

            <section id="view-detail" class="detail-view hidden">
                <div style="margin-bottom: 15px;">
                    <button id="btn-back" class="btn-icon">← Volver</button>
                    <h3 id="detail-title" style="margin-top: 5px; color: #fff;"></h3>
                </div>
                <div id="detail-songs-list" class="simple-list"></div>
            </section>
        </main>

        <div id="mini-player" class="mini-player hidden">
            <div class="player-info">
                <span id="player-title" class="track-title">Ninguna canción</span>
                <span id="player-artist" class="track-artist">--</span>
            </div>
            <div class="player-controls">
                <button id="btn-prev" class="btn-player">⏮</button>
                <button id="btn-play-pause" class="btn-player btn-main-play">▶</button>
                <button id="btn-next" class="btn-player">⏭</button>
            </div>
            <audio id="audio-element"></audio>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
