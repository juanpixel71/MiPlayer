<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Música</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; user-select: none; }
        body { background-color: #121212; color: #ffffff; height: 100vh; overflow: hidden; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; position: absolute; top: 0; left: 0; }
        .screen.active { display: flex; }
        
        /* CABECERAS Y BARRAS INFERIORES */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: #181818; border-bottom: 1px solid #282828; }
        .footer { display: flex; align-items: center; justify-content: center; padding: 12px; background: #181818; border-top: 1px solid #282828; position: absolute; bottom: 0; width: 100%; }
        
        /* CONTENIDO PRINCIPAL */
        .content { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; }
        .btn-change-folder { background: #333; color: #fff; border: none; padding: 6px 12px; font-size: 12px; border-radius: 15px; }

        /* 1ª PANTALLA: ABRIR MI MÚSICA */
        #screen-welcome { justify-content: center; align-items: center; padding: 20px; text-align: center; background: linear-gradient(180deg, #1e1e1e 0%, #121212 100%); }
        .app-logo { font-size: 80px; color: #1db954; margin-bottom: 20px; }
        .welcome-title { font-size: 28px; margin-bottom: 30px; font-weight: bold; }
        .btn-primary { background: #1db954; color: #fff; border: none; padding: 16px 32px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; }
        .btn-primary:active { transform: scale(0.98); }

        /* 2ª PANTALLA: LISTA DE ÁLBUMES */
        .simple-list { display: flex; flex-direction: column; gap: 8px; }
        .list-item { display: flex; align-items: center; background: #181818; padding: 12px 15px; border-radius: 8px; cursor: pointer; }
        .album-icon { font-size: 24px; color: #1db954; margin-right: 15px; }
        .album-title { font-size: 16px; font-weight: 500; }
        .btn-back-footer { background: none; border: none; color: #fff; font-size: 14px; font-weight: bold; display: flex; align-items: center; cursor: pointer; }

        /* 3ª PANTALLA: LISTA DE CANCIONES */
        .song-checkbox { width: 18px; height: 18px; border: 2px solid #535353; border-radius: 3px; margin-right: 15px; }
        .song-title { font-size: 15px; color: #fff; }

        /* 4ª PANTALLA: REPRODUCTOR COMPLETO */
        #screen-player { padding: 30px; text-align: center; justify-content: space-between; }
        .big-cover-art { width: 220px; height: 220px; background: #282828; border-radius: 12px; margin: 40px auto; display: flex; align-items: center; justify-content: center; font-size: 100px; color: #1db954; }
        .track-title { font-size: 22px; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .track-artist-album { font-size: 14px; color: #b3b3b3; margin-bottom: 25px; }
        .controls-row { display: flex; gap: 20px; align-items: center; justify-content: center; margin-bottom: 30px; }
        .btn-player { background: none; border: none; color: #fff; font-size: 28px; cursor: pointer; }
        .btn-play-pause { font-size: 48px; color: #1db954; }
    </style>
</head>
<body>

    <div id="screen-welcome" class="screen active">
        <div class="welcome-content">
            <div class="app-logo">🎵</div>
            <h1 class="welcome-title">ABRIR MI MÚSICA</h1>
            <button id="btn-select-folder" class="btn-primary">Aceptar / Comenzar</button>
            <input type="file" id="file-input" webkitdirectory directory multiple style="display: none;">
        </div>
    </div>

    <div id="screen-albums" class="screen">
        <header class="header">
            <h2>ÁLBUMES</h2>
            <button id="btn-change-folder-albums" class="btn-change-folder">Cambiar Carpeta</button>
        </header>
        <div id="albums-list" class="content simple-list">
            </div>
        <footer class="footer">
            <button id="btn-back-to-welcome" class="btn-back-footer">◀ ATRÁS MIMUS</button>
        </footer>
    </div>

    <div id="screen-songs" class="screen">
        <header class="header">
            <h2 id="songs-album-title">CANCIONES</h2>
        </header>
        <div id="songs-list" class="content simple-list">
            </div>
        <footer class="footer">
            <button id="btn-back-to-albums" class="btn-back-footer">◀ ATRÁS ALBUMS</button>
        </footer>
    </div>

    <div id="screen-player" class="screen">
        <div class="content">
            <div class="big-cover-art">🎵</div>
            <h1 id="player-title" class="track-title">Ninguna canción</h1>
            <p id="player-artist-album" class="track-artist-album">Artista / Álbum</p>
            
            <div class="controls-row">
                <button id="btn-prev" class="btn-player">⏮</button>
                <button id="btn-play-pause" class="btn-player btn-play-pause">▶</button>
                <button id="btn-next" class="btn-player">⏭</button>
            </div>
            <audio id="audio-element"></audio>
        </div>
        <footer class="footer">
            <button id="btn-back-to-songs" class="btn-back-footer">◀ ATRÁS CANCIONES</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
