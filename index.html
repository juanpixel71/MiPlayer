<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Música</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app-container">
    
    <!-- 1ª PANTALLA: Cargar Carpeta Inicial -->
    <section id="screen-1" class="screen">
      <label for="folder-input" class="welcome-box">
        <div class="folder-icon-huge">📁</div>
        <h2>ABRIR MI MÚSICA</h2>
      </label>
      <input type="file" id="folder-input" webkitdirectory directory multiple accept="audio/*" style="display:none;">
    </section>

    <!-- 2ª PANTALLA: Lista de Álbumes -->
    <section id="screen-2" class="screen hidden">
      <header class="screen-header">
        <h1>ÁLBUMS</h1>
      </header>
      <main id="albums-list" class="list-container"></main>
      <footer class="screen-footer">
        <button id="btn-back-mimus" class="btn-nav">◀ ATRÁS MIMUS</button>
      </footer>
    </section>

    <!-- 3ª PANTALLA: Lista de Canciones -->
    <section id="screen-3" class="screen hidden">
      <header class="screen-header">
        <h1 id="screen-3-title">CANCIONES</h1>
      </header>
      <main id="songs-list" class="list-container"></main>
      <footer class="screen-footer">
        <button id="btn-back-albums" class="btn-nav">◀ ATRÁS ÁLBUMS</button>
      </footer>
    </section>

    <!-- 4ª PANTALLA: Reproductor -->
    <section id="screen-4" class="screen hidden">
      <main class="player-body">
        <div class="art-container">
          <div class="art-placeholder">🎵</div>
        </div>
        
        <div class="track-info">
          <h2 id="player-title">01 - CANCIÓN</h2>
          <p id="player-artist">album / artista</p>
        </div>

        <div class="progress-container">
          <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
          <div class="time-labels">
            <span id="time-current">0:00</span>
            <span id="time-total">0:00</span>
          </div>
        </div>

        <div class="player-controls">
          <button id="btn-prev" class="btn-ctrl">⏮</button>
          <button id="btn-play" class="btn-ctrl btn-play">▶</button>
          <button id="btn-next" class="btn-ctrl">⏭</button>
        </div>
      </main>
      <footer class="screen-footer">
        <button id="btn-back-songs" class="btn-nav">◀ ATRÁS CANCIONES</button>
      </footer>
    </section>

    <audio id="audio-element"></audio>
  </div>

  <script src="app.js"></script>
</body>
</html>
