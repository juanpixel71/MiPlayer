<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Música</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* ESTRUCTURA DE LAS 3 PANTALLAS */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #121212;
        }

        .screen.active {
            display: flex;
        }

        /* CABECERAS */
        .header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 20px;
            background-color: #181818;
            border-bottom: 1px solid #282828;
            height: 64px;
        }

        .header h2 {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* CONTENIDO DESLIZABLE */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 76px; /* Espacio reservado para el pie */
        }

        /* PIE DE PÁGINA (SOLO PANTALLAS 2 Y 3) */
        .footer {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 16px;
            background-color: #181818;
            border-top: 1px solid #282828;
            height: 60px;
            position: absolute;
            bottom: 0;
            width: 100%;
        }

        .btn-back-footer {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        /* LISTAS (1ª Y 2ª PANTALLA) */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-item {
            display: flex;
            align-items: center;
            background-color: #181818;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #242424;
            cursor: pointer;
        }

        .list-item:active {
            background-color: #282828;
        }

        /* 1ª PANTALLA: ÁLBUMES */
        .album-cover-placeholder {
            width: 52px;
            height: 52px;
            background-color: #282828;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-right: 16px;
            border: 1px solid #383838;
            flex-shrink: 0;
        }

        .album-text h4 {
            font-size: 17px;
            color: #ffffff;
            font-weight: 600;
        }

        .album-text p {
            font-size: 14px;
            color: #a0a0a0;
            margin-top: 3px;
        }

        /* 2ª PANTALLA: CANCIONES (SIN CHECKBOX) */
        .song-text h4 {
            font-size: 16px;
            color: #ffffff;
            font-weight: 500;
            line-height: 1.3;
        }

        /* 3ª PANTALLA: REPRODUCTOR (MÁS GRANDE) */
        #screen-player .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 24px 20px 80px 20px;
            text-align: center;
        }

        .player-cover-container {
            width: 260px;
            height: 260px;
            background-color: #181818;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #282828;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            margin-top: 10px;
        }

        .player-cover-icon {
            font-size: 110px;
        }

        .player-info-block {
            margin: 24px 0;
            width: 100%;
        }

        /* TÍTULOS Y ARTISTAS AUMENTADOS DE TAMAÑO */
        .player-song-title {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist-album {
            font-size: 18px;
            color: #b3b3b3;
            font-weight: 500;
        }

        /* BOTONES DE CONTROL MÁS GRANDES */
        .player-controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 36px;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-ctrl {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 40px; /* Aumentado */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-ctrl-main {
            width: 76px; /* Aumentado */
            height: 76px; /* Aumentado */
            background-color: #ffffff;
            color: #000000;
            border-radius: 50%;
            font-size: 34px; /* Aumentado */
            padding-left: 4px;
            box-shadow: 0 4px 14px rgba(255,255,255,0.2);
        }

        
    </style>
</head>
<body>

    
    <!-- 1ª PANTALLA: ÁLBUMES (HOME) -->
    <div id="screen-albums" class="screen active">
        <header class="header">
            <h2>ALBUMS</h2>
        </header>
        <div class="content">
            <div class="list-container">
                <div class="list-item">
                    <div class="album-cover-placeholder">🎵</div>
                    <div class="album-text">
                        <h4>Nombre del Álbum 01</h4>
                        <p>12 canciones</p>
                    </div>
                </div>
                <div class="list-item">
                    <div class="album-cover-placeholder">🎵</div>
                    <div class="album-text">
                        <h4>Nombre del Álbum 02</h4>
                        <p>8 canciones</p>
                    </div>
                </div>
            </div>
        </div>
        <!-- Sin pie de página / sin botón de atrás -->
    </div>

    <!-- 2ª PANTALLA: CANCIONES -->
    <div id="screen-songs" class="screen">
        <header class="header">
            <h2 id="songs-header-title">NOMBRE DEL ÁLBUM</h2>
        </header>
        <div class="content">
            <div class="list-container">
                <div class="list-item">
                    <div class="song-text">
                        <h4>01 - Primer Título de Canción</h4>
                    </div>
                </div>
                <div class="list-item">
                    <div class="song-text">
                        <h4>02 - Segundo Título de Canción</h4>
                    </div>
                </div>
                <div class="list-item">
                    <div class="song-text">
                        <h4>03 - Tercer Título de Canción</h4>
                    </div>
                </div>
            </div>
        </div>
        <footer class="footer">
            <button class="btn-back-footer">◀ ATRÁS ALBUMS</button>
        </footer>
    </div>

    <!-- 3ª PANTALLA: REPRODUCTOR -->
    <div id="screen-player" class="screen">
        <div class="content">
            <div class="player-cover-container">
                <div class="player-cover-icon">🎵</div>
            </div>
            
            <div class="player-info-block">
                <h1 class="player-song-title">01 - TÍTULO CANCIÓN</h1>
                <p class="player-artist-album">Nombre del Álbum / Artista</p>
            </div>

            <div class="player-controls-row">
                <button class="btn-ctrl">⏮</button>
                <button class="btn-ctrl btn-ctrl-main">▶</button>
                <button class="btn-ctrl">⏭</button>
            </div>
        </div>
        <footer class="footer">
            <button class="btn-back-footer">◀ ATRÁS CANCIONES</button>
        </footer>
    </div>
<script src="app.js"></script>
    
</body>
</html>
