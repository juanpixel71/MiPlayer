name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r *.html *.js *.json *.png www/ 2>/dev/null || true

      - name: Backup Custom Android Files & Generate Platform
        run: |
          # Crear copias de seguridad de Manifest y Java si existen
          mkdir -p /tmp/android_backup
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/android_backup/
          fi
          if [ -d "android/app/src/main/java" ]; then
            cp -r android/app/src/main/java /tmp/android_backup/
          fi
          
          # Regenerar plataforma Android
          rm -rf android
          npx cap add android
          
          # Restaurar los archivos respaldados
          if [ -f "/tmp/android_backup/AndroidManifest.xml" ]; then
            cp /tmp/android_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -d "/tmp/android_backup/java" ]; then
            cp -r /tmp/android_backup/java android/app/src/main/
          fi

      - name: Replace Android Icons with Custom icon.png
        run: |
          if [ -f "icon.png" ]; then
            echo "Reemplazando iconos de Android..."
            find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp icon.png {} \;
          fi

      - name: Sync Capacitor project
        run: |
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
