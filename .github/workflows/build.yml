name: Generar APK Reproductor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Preparar proyecto y compilar APK
        run: |
          # 1. Crear carpeta www y copiar archivos web
          mkdir -p www
          cp index.html style.css app.js manifest.json www/ 2>/dev/null || true

          # 2. Inicializar NPM y Capacitor
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Mi Musica" "com.juanpixel.mimusica" --web-dir www

          # 3. Añadir plataforma Android
          npx cap add android

          # 4. Inyectar permisos de lectura de audio/almacenamiento en AndroidManifest.xml
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>' $MANIFEST_FILE
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" \/>' $MANIFEST_FILE

          # 5. Sincronizar y Compilar APK
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MiMusica-App-Nativa
          path: android/app/build/outputs/apk/debug/app-debug.apk
