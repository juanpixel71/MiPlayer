name: Generar APK Reproductor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Compilar APK con Acceso Directo a Almacenamiento
        run: |
          # 1. Preparar carpeta web
          rm -rf www
          mkdir -p www
          cp index.html app.js manifest.json www/ 2>/dev/null || true
          cp icon.png www/ 2>/dev/null || true

          # 2. Inicializar Capacitor
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/filesystem@latest
          npx cap init "Mi Musica" "com.juanpixel.mimusica" --web-dir www
          npx cap add android

          # 3. Arreglar el ICONO en Android (Eliminar adaptativo y forzar PNG)
          node -e '
            const fs = require("fs");
            const path = require("path");
            const resDir = "android/app/src/main/res";
            if (fs.existsSync("icon.png") && fs.existsSync(resDir)) {
              const mipmaps = fs.readdirSync(resDir).filter(d => d.startsWith("mipmap"));
              mipmaps.forEach(folder => {
                const targetDir = path.join(resDir, folder);
                fs.copyFileSync("icon.png", path.join(targetDir, "ic_launcher.png"));
                fs.copyFileSync("icon.png", path.join(targetDir, "ic_launcher_round.png"));
                fs.copyFileSync("icon.png", path.join(targetDir, "ic_launcher_foreground.png"));
              });
              const anyDpiDir = path.join(resDir, "mipmap-anydpi-v26");
              if (fs.existsSync(anyDpiDir)) {
                fs.rmSync(anyDpiDir, { recursive: true, force: true });
              }
            }
          '

          # 4. Inyectar Permisos de Almacenamiento Raíz Nativo
          node -e '
            const fs = require("fs");
            const file = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              const permissions = `
                <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
                <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
                <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
                <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              `;
              content = content.replace("<application", permissions + "\n<application android:requestLegacyExternalStorage=\"true\"");
              fs.writeFileSync(file, content, "utf8");
            }
          '

          # 5. Sincronizar y compilar APK
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir Artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMusica-App-Nativa
          path: android/app/build/outputs/apk/debug/app-debug.apk
