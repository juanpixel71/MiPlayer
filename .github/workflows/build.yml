name: Generar APK Reproductor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Compilar APK
        run: |
          mkdir -p www
          cp index.html style.css app.js manifest.json www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Mi Musica" "com.juanpixel.mimusica" --web-dir www
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir Artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMusica-App-Nativa
          path: android/app/build/outputs/apk/debug/app-debug.apk
