name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Save Manifest
        run: |
          mkdir -p /tmp/manifest_backup
          cp android/app/src/main/AndroidManifest.xml /tmp/manifest_backup/ 2>/dev/null || true

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r index.html app.js styles.css icon.png manifest.json www/ 2>/dev/null || true
          if [ -d "music" ]; then cp -r music www/; fi

      - name: Recreate Android Project
        run: |
          rm -rf android
          npx cap add android

      - name: Restore Manifest
        run: |
          if [ -f "/tmp/manifest_backup/AndroidManifest.xml" ]; then
            cp /tmp/manifest_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Copy Custom App Icon
        run: |
          if [ -f "icon.png" ]; then
            find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp icon.png {} \;
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
