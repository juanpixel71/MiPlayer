name: Generar APK Reproductor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Compilar APK
        run: |
          # 1. Limpiar y preparar carpeta web
          rm -rf www
          mkdir -p www
          cp index.html app.js manifest.json www/ 2>/dev/null || true
          cp icon.png www/ 2>/dev/null || true

          # 2. Inicializar Capacitor
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Mi Musica" "com.juanpixel.mimusica" --web-dir www
          npx cap add android

          # 3. Forzar reemplazo simple del icono principal
          node -e '
            const fs = require("fs");
            const path = require("path");
            if (fs.existsSync("icon.png")) {
              const resDir = "android/app/src/main/res";
              if (fs.existsSync(resDir)) {
                const mipmaps = fs.readdirSync(resDir).filter(d => d.startsWith("mipmap"));
                mipmaps.forEach(folder => {
                  fs.copyFileSync("icon.png", path.join(resDir, folder, "ic_launcher.png"));
                });
              }
            }
          '

          # 4. Sincronizar y compilar APK sin sobrecargar permisos
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir Artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMusica-App-Nativa
          path: android/app/build/outputs/apk/debug/app-debug.apk
